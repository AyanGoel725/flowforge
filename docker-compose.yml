version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge_password
      POSTGRES_DB: flowforge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: api
    container_name: flowforge-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://flowforge:flowforge_password@postgres:5432/flowforge?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      REDIS_STREAM: "flowforge:jobs"
      REDIS_CONSUMER_GROUP: "flowforge-workers"
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: worker
    container_name: flowforge-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://flowforge:flowforge_password@postgres:5432/flowforge?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      REDIS_STREAM: "flowforge:jobs"
      REDIS_CONSUMER_GROUP: "flowforge-workers"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
