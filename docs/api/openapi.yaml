openapi: "3.1.0"
info:
  title: FlowForge API
  description: |
    FlowForge is a distributed job orchestration platform.
    Stage 1 provides basic asynchronous job submission, execution, and status retrieval.
  version: "0.1.0"
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /jobs:
    post:
      operationId: createJob
      summary: Submit a new job
      description: |
        Creates a job in PostgreSQL, publishes it to the Redis stream,
        and returns the job ID. The job starts in PENDING and transitions
        to QUEUED once the Redis publish succeeds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            examples:
              echo:
                summary: Echo task
                value:
                  type: echo
                  payload:
                    message: "hello FlowForge"
              sleep:
                summary: Sleep task
                value:
                  type: sleep
                  payload:
                    seconds: 5
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateJobResponse"
        "400":
          description: Invalid request (bad JSON, missing fields, unknown type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: listJobs
      summary: List jobs with pagination
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of jobs to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of jobs to skip
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListJobsResponse"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{id}:
    get:
      operationId: getJob
      summary: Get job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid UUID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      summary: Liveness probe
      description: Returns 200 if the API process is alive.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: readinessCheck
      summary: Readiness probe
      description: |
        Returns 200 if PostgreSQL and Redis are reachable.
        Returns 503 if any dependency is unavailable.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready — one or more dependencies unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

components:
  schemas:
    CreateJobRequest:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum: [echo, sleep]
          description: Task type to execute
        payload:
          type: object
          description: Task-specific payload (JSONB)

    CreateJobResponse:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED]

    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
          enum: [PENDING, QUEUED, RUNNING, COMPLETED, FAILED]
        payload:
          type: object
        result:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    ListJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        total:
          type: integer
          description: Total number of jobs matching the query
        limit:
          type: integer
        offset:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          properties:
            postgres:
              type: string
              enum: [ok, fail]
            redis:
              type: string
              enum: [ok, fail]
