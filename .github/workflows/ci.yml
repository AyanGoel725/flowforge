name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted according to gofmt:"
            gofmt -l .
            exit 1
          fi

  test:
    name: Unit Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run unit tests
        run: go test -v -race ./...

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build API
        run: go build -v ./cmd/api

      - name: Build Dispatcher
        run: go build -v ./cmd/dispatcher

      - name: Build Worker
        run: go build -v ./cmd/worker

      - name: Build Migrate
        run: go build -v ./cmd/migrate

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge_password
          POSTGRES_DB: flowforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run integration tests
        env:
          DATABASE_URL: "postgres://flowforge:flowforge_password@localhost:5432/flowforge?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          REDIS_STREAM: "flowforge:jobs"
          REDIS_CONSUMER_GROUP: "flowforge-workers"
        run: go test -v -tags=integration ./tests/integration/...

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build --build-arg TARGET=api -t flowforge-api:test .

      - name: Build Dispatcher Docker Image
        run: docker build --build-arg TARGET=dispatcher -t flowforge-dispatcher:test .

      - name: Build Worker Docker Image
        run: docker build --build-arg TARGET=worker -t flowforge-worker:test .

      - name: Build Migrate Docker Image
        run: docker build --build-arg TARGET=migrate -t flowforge-migrate:test .
